<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic City — Каталог машинок</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mc_theme')||'dark'}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <div id="site-header"></div>

  <section class="video-scroll-container" id="videoSection">
    <div class="video-sticky-box">
      <video class="scroll-video" id="scrollVideo" preload="auto" muted playsinline webkit-playsinline>
        <source src="car-drift-smooth.mp4" type="video/mp4" />
        <source src="car-drift.mp4" type="video/mp4" />
      </video>
      <div class="video-overlay" id="videoOverlay">
        <h1 class="overlay-title">Magic City</h1>
        <p class="overlay-sub">Крутите колесико мыши вниз для дрифта</p>
        <div class="scroll-hint"></div>
      </div>
      <div class="video-progress"><i id="videoBar"></i></div>
    </div>
  </section>

  <main class="catalog-section" id="catalog">
    <div class="catalog-header">
      <h2>Каталог машинок (<span id="count">0</span>)</h2>
      <div class="catalog-controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию..." />
        <select id="sortSelect" class="select" aria-label="Сортировка">
          <option value="default">Сначала популярные</option>
          <option value="asc">Сначала дешёвые</option>
          <option value="desc">Сначала дорогие</option>
          <option value="rating">По рейтингу</option>
        </select>
      </div>
      <div class="filter-buttons" id="filterContainer">
        <button class="filter-btn active" data-category="Все">Все</button>
        <button class="filter-btn" data-category="Суперкары">Суперкары</button>
        <button class="filter-btn" data-category="Дрифт">Дрифт</button>
        <button class="filter-btn" data-category="Внедорожники">Внедорожники</button>
        <button class="filter-btn" data-category="Монстр-траки">Монстр-траки</button>
        <button class="filter-btn" data-category="Ретро">Ретро</button>
        <button class="filter-btn" data-category="Спорт">Спорт</button>
      </div>
    </div>
    <div class="grid" id="productsGrid"></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
