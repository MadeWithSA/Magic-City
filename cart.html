<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Корзина — Magic City</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mc_theme')||'dark'}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="cart" class="inner">
  <div id="site-header"></div>
  <main class="page"><div class="wrap">
    <h1 class="page-title">Корзина</h1>
    <p class="page-sub">Проверьте заказ и укажите данные для доставки</p>
    <div class="cart-layout">
      <div class="cart-list" id="cartList"></div>
      <aside class="panel sticky" id="cartSide">
        <h3>Оформление заказа</h3>
        <div class="sum-row"><span>Товаров</span><span id="sumCount">0</span></div>
        <div class="sum-row total"><span>Итого</span><span id="sumTotal">0 ₽</span></div>
        <form id="checkoutForm" novalidate style="margin-top:18px">
          <div class="field"><label for="fName">Имя</label><input id="fName" autocomplete="name" placeholder="Как к вам обращаться" /></div>
          <div class="field"><label for="fPhone">Телефон</label><input id="fPhone" type="tel" autocomplete="tel" placeholder="+998 90 123 45 67" /></div>
          <div class="field"><label for="fAddress">Адрес доставки</label><input id="fAddress" autocomplete="street-address" placeholder="Город, улица, дом" /></div>
          <div class="field"><label for="fNote">Комментарий</label><textarea id="fNote" placeholder="Необязательно"></textarea></div>
          <button class="btn big" id="orderBtn" type="submit">Оформить заказ</button>
        </form>
      </aside>
    </div>
  </div></main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
